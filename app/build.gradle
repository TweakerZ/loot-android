plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}

android {
    namespace 'com.lootandroid'
    compileSdk 35

    defaultConfig {
        applicationId 'com.skyrimandroid.loot'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '0.1.4'

        ndk {
            // libloot is cross-compiled for 64-bit ARM Android only.
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Two builds of the same app. "iconless" has no launcher entry and is
    // started by Skyrim Mod Loader; "launcher" adds the drawer icon.
    flavorDimensions 'launcher'
    productFlavors {
        iconless {
            dimension 'launcher'
        }
        launcher {
            dimension 'launcher'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    // Shared Material You design system (sibling repository).
    sourceSets {
        main.java.srcDirs += rootProject.file('../skyrim-suite-ui/src/main/kotlin')
    }
}

// Chaquopy requires a build-time Python with the same major/minor version as
// the app runtime. The host's default Python may be newer, so allow pointing
// at a 3.13 interpreter explicitly (see README).
def lootBuildPython = System.getenv('LOOT_BUILD_PYTHON')

chaquopy {
    defaultConfig {
        version = '3.13'
        if (lootBuildPython) {
            buildPython lootBuildPython
        }

        pip {
            // The libloot Android wheel lives in app/src/main/wheels.
            // See app/src/main/wheels/README.md for how to rebuild it.
            options('--find-links', file('src/main/wheels').absolutePath)
            install 'libloot'
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Compose UI stack. The BOM pins every Compose module version.
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
